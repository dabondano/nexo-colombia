name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NEXO_TEST_DATABASE_URL: postgresql+psycopg://nexo:nexo@localhost:5432/nexo_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy app tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm build

  # Web interface and accessibility tests against invented sample data.
  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo_ui"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NEXO_DATABASE_URL: postgresql+psycopg://nexo:nexo@localhost:5432/nexo_ui
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: API with sample data
        working-directory: backend
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          uv run python -m tests.seed_ui
          nohup .venv/bin/uvicorn app.main:app --port 8000 > ../api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/v1/health/ready && break; sleep 1; done
      - name: Web application
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          nohup pnpm start -p 3000 > ../web.log 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3000/ && break; sleep 1; done
      - name: Browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Interface and accessibility tests
        working-directory: frontend
        run: pnpm test:e2e
      - name: Logs and report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            api.log
            web.log
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # The production stack (deploy/compose.yaml) built and run end to end, with
  # Caddy serving https://localhost and invented sample data.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings
        run: |
          {
            echo "NEXO_DOMAIN=localhost"
            echo "ACME_EMAIL=ci@example.org"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "NEXO_APP_DB_PASSWORD=$(openssl rand -hex 24)"
          } > deploy/.env
      - name: Build and start the stack
        working-directory: deploy
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Sample data
        working-directory: deploy
        # As the owner: seeding empties tables, which the application account cannot do.
        run: docker compose exec -T api sh -c 'NEXO_DATABASE_URL="$NEXO_MIGRATION_DATABASE_URL" python -m tests.seed_ui --force'
      - name: Smoke tests through Caddy
        run: |
          set -euo pipefail
          code() { curl -sk -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code https://localhost/)" = 200
          test "$(code https://localhost/presupuesto/99-01-00)" = 200
          test "$(code https://localhost/presupuesto/00-00-00)" = 404
          test "$(code https://localhost/representantes/00000000-0000-0000-0000-000000000000)" = 404
          test "$(code http://localhost/)" = 308
          headers=$(curl -sk -D - -o /dev/null https://localhost/)
          echo "$headers" | grep -qi '^strict-transport-security:'
          ! echo "$headers" | grep -qi '^server:'
          location=$(curl -sk -o /dev/null -w '%{redirect_url}' https://localhost/panel)
          test "$location" = "https://localhost/ingresar"
          # The API and the database are not published.
          ! curl -s --max-time 3 http://localhost:8000/api/v1/health
          ! (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null
          # Per-IP limit on staff sign-in: 10 POST a minute, then 429.
          statuses=$(for i in $(seq 1 12); do code -X POST https://localhost/ingresar; echo; done)
          echo "$statuses" | sort | uniq -c
          echo "$statuses" | grep -q '^429$'
      - name: The application account cannot rewrite the audit log
        working-directory: deploy
        run: |
          docker compose exec -T api python -c "
          import sys
          from sqlalchemy import create_engine, text
          from app.core.config import get_settings
          with create_engine(get_settings().database_url).connect() as c:
              assert c.execute(text('select current_user')).scalar() == 'nexo_app'
              try:
                  c.execute(text('TRUNCATE core.audit_event'))
              except Exception as e:
                  assert 'permission denied' in str(e), e
                  sys.exit(0)
          sys.exit('TRUNCATE was allowed')
          "
      - name: Backup script
        run: |
          deploy/scripts/backup.sh
          ls -l deploy/backups
          test -s "$(ls deploy/backups/nexo-*.dump | head -1)"
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: docker compose logs --no-color --tail 200

  # The single container for a free Render service (deploy/render), run as Render
  # runs it, against PostgreSQL with invented sample data.
  render-image:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexo
          POSTGRES_PASSWORD: nexo
          POSTGRES_DB: nexo_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexo -d nexo_ui"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -f deploy/render/Dockerfile -t nexo-render .
      - name: Restricted application account (created with SQL, as on Neon)
        run: PGPASSWORD=nexo psql -h localhost -U nexo -d nexo_ui -c "CREATE ROLE nexo_app LOGIN PASSWORD 'nexo_app'"
      - name: Start like Render does
        run: |
          docker run -d --name nexo --network host \
            -e PORT=10000 \
            -e NEXO_ENVIRONMENT=production \
            -e NEXO_CLIENT_IP_HEADER=true-client-ip \
            -e NEXO_DATABASE_URL=postgresql://nexo_app:nexo_app@localhost:5432/nexo_ui \
            -e NEXO_MIGRATION_DATABASE_URL=postgresql://nexo:nexo@localhost:5432/nexo_ui \
            nexo-render
          for i in $(seq 1 60); do curl -sf -o /dev/null http://localhost:10000/ && break; sleep 2; done
          docker exec -w /app/api -e NEXO_DATABASE_URL=postgresql://nexo:nexo@localhost:5432/nexo_ui \
            nexo python -m tests.seed_ui --force
      - name: Smoke tests
        run: |
          set -euo pipefail
          code() { curl -s -o /dev/null -w '%{http_code}' "$@"; }
          test "$(code http://localhost:10000/)" = 200
          test "$(code http://localhost:10000/presupuesto/99-01-00)" = 200
          test "$(code http://localhost:10000/presupuesto/00-00-00)" = 404
          test "$(code http://localhost:10000/panel)" = 307
          # The application runs as the restricted account, which cannot rewrite the audit log.
          PGPASSWORD=nexo_app psql -h localhost -U nexo_app -d nexo_ui -c 'TRUNCATE core.audit_event' 2>&1 | grep -q 'permission denied'
          PGPASSWORD=nexo_app psql -h localhost -U nexo_app -d nexo_ui -c 'DELETE FROM core.audit_event' 2>&1 | grep -q 'permission denied'
          # The API listens on 127.0.0.1 inside the container only.
          docker exec nexo python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready')"
          # Per-IP limit on staff forms, keyed on the trusted header.
          statuses=$(for i in $(seq 1 12); do code -X POST -H 'true-client-ip: 203.0.113.5' http://localhost:10000/ingresar; echo; done)
          echo "$statuses" | sort | uniq -c
          test "$(echo "$statuses" | grep -c '^429$')" = 2
          test "$(code -X POST -H 'true-client-ip: 198.51.100.7' http://localhost:10000/ingresar)" != 429
      - name: Memory use (Render's free instance has 512 MB)
        run: |
          for page in / /presupuesto /legislacion /constitucion /representantes; do
            curl -s -o /dev/null "http://localhost:10000$page"
          done
          docker stats --no-stream --format '{{.MemUsage}}' nexo
      - name: Logs on failure
        if: failure()
        run: docker logs nexo --tail 200

